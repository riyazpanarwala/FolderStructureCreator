name: Build & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Portable Executables & Installer Setup
        shell: powershell
        run: |
          # Create output folders
          New-Item -ItemType Directory -Force -Path "publish"
          New-Item -ItemType Directory -Force -Path "installer-output"

          # 1. Ultra-lightweight Framework-Dependent Portable EXE (~0.3 MB)
          Write-Host "==> Publishing Lightweight Portable EXE (Framework-Dependent ~0.3 MB)..."
          dotnet publish src/FolderStructureCreator/FolderStructureCreator.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o publish-lightweight

          # Rename lightweight build for release
          Copy-Item "publish-lightweight/FolderStructureCreator.exe" "installer-output/FolderStructureCreator.exe"
          Compress-Archive -Path "installer-output/FolderStructureCreator.exe" -DestinationPath "installer-output/FolderStructureCreator_Portable_Lightweight.zip" -Force

          # 2. Self-Contained Standalone EXE with Compression (~68 MB down from 154 MB)
          Write-Host "==> Publishing Self-Contained Standalone EXE with compression..."
          dotnet publish src/FolderStructureCreator/FolderStructureCreator.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish-standalone

          Copy-Item "publish-standalone/FolderStructureCreator.exe" "installer-output/FolderStructureCreator_Standalone.exe"

          # 3. Build Windows Installer (.exe Setup)
          Write-Host "==> Building Inno Setup Installer..."
          Set-Location installer
          .\build-installer.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/FolderStructureCreator.exe
            installer-output/FolderStructureCreator_Portable_Lightweight.zip
            installer-output/FolderStructureCreator_Standalone.exe
            installer-output/FolderStructureCreatorSetup.exe
          generate_release_notes: true
