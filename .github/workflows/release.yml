name: Build & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Portable Executable & Installer Setup
        shell: powershell
        run: |
          # Create output folders
          New-Item -ItemType Directory -Force -Path "publish"
          New-Item -ItemType Directory -Force -Path "installer-output"

          # 1. Publish self-contained single-file portable executable
          Write-Host "==> Publishing single-file portable EXE..."
          dotnet publish src/FolderStructureCreator/FolderStructureCreator.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

          # 2. Package Portable EXE into a ZIP archive
          Write-Host "==> Creating Portable ZIP archive..."
          Compress-Archive -Path "publish/FolderStructureCreator.exe" -DestinationPath "installer-output/FolderStructureCreator_Portable.zip" -Force

          # 3. Build Windows Installer (.exe Setup)
          Write-Host "==> Building Inno Setup Installer..."
          Set-Location installer
          .\build-installer.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/FolderStructureCreatorSetup.exe
            installer-output/FolderStructureCreator_Portable.zip
            publish/FolderStructureCreator.exe
          generate_release_notes: true
